[package]
name = "pdf_engine"
version = "0.1.0"
edition = "2021"
description = "Typographic editorial PDF layout and vector rendering engine compiled to WebAssembly"
authors = ["ABu <abustark>"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
